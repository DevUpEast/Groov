<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>iOS Mockup</title>
<meta name="description" content="Interactive iPhone frame around a web build of a mobile app, for design review and automated screenshots.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='7' y='2' width='18' height='28' rx='5' fill='%23111'/%3E%3Crect x='9' y='5' width='14' height='22' rx='3' fill='%234F46E5'/%3E%3C/svg%3E">
<link rel="stylesheet" href="mockup.css">
</head>
<body>
<header id="bar">
  <div class="brand"><span class="dot"></span> iOS Mockup</div>
  <label>App <select id="app"></select></label>
  <label>Device <select id="device"></select></label>
  <label>Appearance
    <select id="theme">
      <option value="system">System</option>
      <option value="light">Light</option>
      <option value="dark">Dark</option>
    </select>
  </label>
  <label>Scale
    <select id="scale">
      <option value="fit">Fit</option>
      <option value="1">100%</option>
      <option value="0.75">75%</option>
      <option value="0.5">50%</option>
    </select>
  </label>
  <label class="grow">Route <input id="route" list="routes" placeholder="today" spellcheck="false"><datalist id="routes"></datalist></label>
  <button id="go" title="Navigate the app to the route">Go</button>
  <button id="reload" title="Reload the app">Reload</button>
  <button id="frameToggle" title="Show or hide the phone bezel">Bezel</button>
  <button id="share" title="Copy a link that restores this exact state">Copy link</button>
  <a id="bare" href="#" target="_blank" rel="noopener" title="Open just the app">Open app ↗</a>
</header>

<main id="stage">
  <div id="phone" class="phone">
    <div class="bezel">
      <div class="screen">
        <iframe id="screenFrame" title="App" allow="clipboard-write; autoplay"></iframe>
        <div class="statusbar" id="statusbar">
          <span class="time" id="clock">9:41</span>
          <span class="island" id="island"></span>
          <span class="right">
            <svg class="sig" viewBox="0 0 18 12" aria-hidden="true"><rect x="0" y="8" width="3" height="4" rx="0.8"/><rect x="5" y="5.5" width="3" height="6.5" rx="0.8"/><rect x="10" y="3" width="3" height="9" rx="0.8"/><rect x="15" y="0" width="3" height="12" rx="0.8"/></svg>
            <svg class="wifi" viewBox="0 0 16 12" aria-hidden="true"><path d="M8 11.3a1.4 1.4 0 1 0 0-2.8 1.4 1.4 0 0 0 0 2.8zM3.8 7.2a6 6 0 0 1 8.4 0l1.2-1.3a7.8 7.8 0 0 0-10.8 0zM.6 3.9a10.6 10.6 0 0 1 14.8 0L16.6 2.6a12.4 12.4 0 0 0-17.2 0z"/></svg>
            <span class="battery"><i></i></span>
          </span>
        </div>
        <div class="homebar" id="homebar"></div>
      </div>
    </div>
  </div>
  <p id="hint" class="hint"></p>
</main>

<script src="mockup.js"></script>
</body>
</html>
